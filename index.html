<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>端末貸出システム</title>
<style>
  body {
    font-family: -apple-system, BlinkMacSystemFont, "Hiragino Sans", "Yu Gothic", sans-serif;
    text-align: center;
    padding: 16px;
    max-width: 480px;
    margin: 0 auto;
    color: #222;
  }
  h1 { font-size: 22px; margin-bottom: 4px; }
  h2 { font-size: 18px; margin-top: 24px; }
  .btn {
    display: block;
    width: 100%;
    margin: 8px 0;
    padding: 16px;
    font-size: 18px;
    border: 2px solid #333;
    border-radius: 8px;
    background: #fff;
    cursor: pointer;
    box-sizing: border-box;
  }
  .btn:active { background: #eee; }
  .btn.mode-borrow { border-color: #1a6b3c; color: #1a6b3c; }
  .btn.mode-return { border-color: #a3400c; color: #a3400c; }
  .grid {
    display: grid;
    grid-template-columns: repeat(5, 1fr);
    gap: 8px;
  }
  .grid .btn { padding: 12px 0; font-size: 16px; margin: 0; }
  #reader-device, #reader-teacher { width: 100%; margin: 0 auto; }
  .hidden { display: none; }
  #confirmName { font-size: 22px; font-weight: bold; margin: 20px 0; }
  #status {
    margin-top: 16px;
    font-size: 17px;
    font-weight: bold;
    white-space: pre-wrap;
    line-height: 1.6;
  }
  .ok { color: #0a7a2f; }
  .error { color: #c00000; }
  #backBtn { margin-top: 24px; background: #eee; border-color: #999; }
  .badge {
    display: inline-block;
    padding: 4px 12px;
    border-radius: 20px;
    font-size: 13px;
    margin-bottom: 8px;
  }
  .badge-borrow { background: #e5f5ec; color: #1a6b3c; }
  .badge-return { background: #fbe9df; color: #a3400c; }
  #loadingMsg { color: #888; margin-top: 40px; }
  #manualInputToggleArea { margin-top: 16px; }
  #manualInputToggleArea a { color: #555; font-size: 14px; text-decoration: underline; }
  #manualInputArea { margin-top: 20px; padding-top: 16px; border-top: 1px solid #ddd; }
  #manualTeacherId {
    width: 100%;
    box-sizing: border-box;
    font-size: 20px;
    padding: 12px;
    border: 2px solid #333;
    border-radius: 8px;
    text-align: center;
    margin-bottom: 8px;
  }
</style>
</head>
<body>

<h1>端末貸出システム</h1>

<!-- 読み込み中表示 -->
<div id="loadingMsg">読み込み中…</div>

<!-- STEP0: 貸出 or 返却 -->
<div id="step0" class="hidden">
  <h2>貸出ですか？返却ですか？</h2>
  <button class="btn mode-borrow" onclick="selectMode('borrow')">貸出する</button>
  <button class="btn mode-return" onclick="selectMode('return')">返却する</button>
</div>

<!-- STEP1: 学科選択 -->
<div id="step1" class="hidden">
  <div id="modeBadge1"></div>
  <h2>学科を選んでください</h2>
  <div id="deptButtons"></div>
</div>

<!-- STEP2: 出席番号選択 -->
<div id="step2" class="hidden">
  <div id="modeBadge2"></div>
  <h2>出席番号を選んでください</h2>
  <div id="numberButtons" class="grid"></div>
</div>

<!-- STEP3: 氏名確認 -->
<div id="step3" class="hidden">
  <div id="modeBadge3"></div>
  <div id="confirmName"></div>
  <button class="btn" onclick="confirmYes()">はい</button>
  <button class="btn" onclick="confirmNo()">いいえ（番号を選び直す）</button>
</div>

<!-- STEP4: 端末QR読み取り -->
<div id="step4" class="hidden">
  <div id="modeBadge4"></div>
  <h2>端末のQRコードを読み込んでください</h2>
  <div id="reader-device"></div>
</div>

<!-- STEP5: 教員QR読み取り -->
<div id="step5" class="hidden">
  <div id="modeBadge5"></div>
  <h2>教員のQRコードを読み込んでください</h2>
  <div id="reader-teacher"></div>

  <div id="manualInputToggleArea">
    <a href="#" id="manualInputLink" onclick="showManualInput(); return false;">QRが読み取れない場合はこちら（IDを直接入力）</a>
  </div>

  <div id="manualInputArea" class="hidden">
    <h2>教員IDを入力してください</h2>
    <input type="text" id="manualTeacherId" placeholder="例: T001" autocomplete="off">
    <button class="btn" onclick="submitManualTeacherId()">確定する</button>
    <div id="manualInputError" class="error" style="margin-top:8px; font-size:14px;"></div>
  </div>
</div>

<!-- STEP6: 完了・エラー表示 -->
<div id="step6" class="hidden">
  <div id="status"></div>
  <button class="btn" id="backBtn" onclick="resetFlow()">最初に戻る</button>
</div>

<script src="https://unpkg.com/html5-qrcode"></script>
<script>
// ============================================================
// 設定：GASのWebアプリURL（本番用）
// ============================================================
const GAS_URL = 'https://script.google.com/a/macros/hokkaido-c.ed.jp/s/AKfycbw_6J2ojgmzwT1sv3JsEqb97cbpfssOOCLer-BWLOhuU9bj4OxluUsANTnL3wA27ysj/exec';

// ============================================================
// 状態管理
// ============================================================
let students = [];
let teachers = [];
let flow = {
  mode: null,       // 'borrow' or 'return'
  dept: null,
  number: null,
  name: null,
  deviceId: null,
  teacherId: null,
  teacherName: null
};
let deviceScanner = null;
let teacherScanner = null;

// ============================================================
// JSONPヘルパー（CORS制約を回避するため、fetchではなくscriptタグ方式で通信する）
// ============================================================
function jsonpRequest(params) {
  return new Promise((resolve, reject) => {
    const callbackName = 'jsonp_cb_' + Date.now() + '_' + Math.floor(Math.random() * 100000);

    const timeout = setTimeout(() => {
      cleanup();
      reject(new Error('タイムアウトしました（通信環境をご確認ください）'));
    }, 15000);

    function cleanup() {
      clearTimeout(timeout);
      delete window[callbackName];
      if (script.parentNode) script.parentNode.removeChild(script);
    }

    window[callbackName] = (data) => {
      cleanup();
      resolve(data);
    };

    const query = new URLSearchParams(Object.assign({}, params, { callback: callbackName })).toString();
    const script = document.createElement('script');
    script.src = GAS_URL + '?' + query;
    script.onerror = () => {
      cleanup();
      reject(new Error('サーバーへの接続に失敗しました'));
    };
    document.body.appendChild(script);
  });
}

// ============================================================
// 初期化：名簿・教員リストを取得
// ============================================================
async function init() {
  try {
    const data = await jsonpRequest({ action: 'roster' });
    if (data.status !== 'ok') {
      showInitError(data.message || '名簿の取得に失敗しました');
      return;
    }
    students = data.students;
    teachers = data.teachers;
    document.getElementById('loadingMsg').classList.add('hidden');
    showStep(0);
  } catch (err) {
    showInitError(err.message);
  }
}

function showInitError(msg) {
  const el = document.getElementById('loadingMsg');
  el.textContent = '読み込みエラー: ' + msg;
  el.style.color = '#c00000';
}

init();

// ============================================================
// STEP0: 貸出/返却モード選択
// ============================================================
function selectMode(mode) {
  flow.mode = mode;
  updateModeBadges();
  renderDeptButtons();
  showStep(1);
}

function updateModeBadges() {
  const label = flow.mode === 'borrow' ? '貸出' : '返却';
  const cls = flow.mode === 'borrow' ? 'badge-borrow' : 'badge-return';
  for (let i = 1; i <= 5; i++) {
    const el = document.getElementById('modeBadge' + i);
    if (el) el.innerHTML = '<span class="badge ' + cls + '">' + label + '</span>';
  }
}

// ============================================================
// STEP1: 学科ボタン
// ============================================================
function renderDeptButtons() {
  const depts = [...new Set(students.map(s => s.dept))];
  const container = document.getElementById('deptButtons');
  container.innerHTML = '';
  depts.forEach(dept => {
    const btn = document.createElement('button');
    btn.className = 'btn';
    btn.textContent = dept;
    btn.onclick = () => selectDept(dept);
    container.appendChild(btn);
  });
}

function selectDept(dept) {
  flow.dept = dept;
  const numbers = students
    .filter(s => s.dept === dept)
    .sort((a, b) => a.number - b.number);

  const container = document.getElementById('numberButtons');
  container.innerHTML = '';
  numbers.forEach(s => {
    const btn = document.createElement('button');
    btn.className = 'btn';
    btn.textContent = s.number;
    btn.onclick = () => selectNumber(s);
    container.appendChild(btn);
  });
  showStep(2);
}

// ============================================================
// STEP2 → STEP3: 出席番号選択
// ============================================================
function selectNumber(student) {
  flow.number = student.number;
  flow.name = student.name;
  document.getElementById('confirmName').textContent = student.name + ' さんでよろしいですか？';
  showStep(3);
}

function confirmNo() {
  showStep(2);
}

function confirmYes() {
  showStep(4);
  startDeviceScanner();
}

// ============================================================
// STEP4: 端末QR読み取り
// ============================================================
function startDeviceScanner() {
  if (deviceScanner) {
    try { deviceScanner.clear(); } catch (e) {}
  }
  deviceScanner = new Html5QrcodeScanner("reader-device", { fps: 10, qrbox: 250 });
  deviceScanner.render(onDeviceScanSuccess, () => {});
}

function onDeviceScanSuccess(decodedText) {
  flow.deviceId = decodedText;
  deviceScanner.clear().catch(() => {});
  showStep(5);
  startTeacherScanner();
}

// ============================================================
// STEP5: 教員QR読み取り
// ============================================================
function startTeacherScanner() {
  if (teacherScanner) {
    try { teacherScanner.clear(); } catch (e) {}
  }
  // 手入力欄を初期状態に戻す
  document.getElementById('manualInputArea').classList.add('hidden');
  document.getElementById('manualInputToggleArea').classList.remove('hidden');
  document.getElementById('manualTeacherId').value = '';
  document.getElementById('manualInputError').textContent = '';

  teacherScanner = new Html5QrcodeScanner("reader-teacher", { fps: 10, qrbox: 250 });
  teacherScanner.render(onTeacherScanSuccess, () => {});
}

function onTeacherScanSuccess(decodedText) {
  teacherScanner.clear().catch(() => {});
  handleTeacherId(decodedText);
}

// QRスキャンでも手入力でも、最終的にここで教員IDを照合する（処理を共通化）
function handleTeacherId(rawId) {
  const id = String(rawId).trim();
  const teacher = teachers.find(t => t.id === id);

  if (!teacher) {
    showStep(6);
    showStatus('登録されていない教員IDです（入力値: ' + id + '）。\nもう一度お試しいただくか、担当の先生にご確認ください。', false);
    return;
  }

  flow.teacherId = teacher.id;
  flow.teacherName = teacher.name;
  submitRecord();
}

// ===== 手入力フォールバック =====
function showManualInput() {
  document.getElementById('manualInputArea').classList.remove('hidden');
  document.getElementById('manualInputToggleArea').classList.add('hidden');
  if (teacherScanner) {
    teacherScanner.clear().catch(() => {});
  }
  document.getElementById('manualTeacherId').focus();
}

function submitManualTeacherId() {
  const input = document.getElementById('manualTeacherId');
  const errorEl = document.getElementById('manualInputError');
  const value = input.value.trim();

  if (!value) {
    errorEl.textContent = 'IDを入力してください';
    return;
  }
  errorEl.textContent = '';
  handleTeacherId(value);
}

// ============================================================
// STEP6: GASへ送信（貸出 or 返却）
// ============================================================
async function submitRecord() {
  showStep(6);
  showStatus('送信中…', true);

  const params = {
    action: flow.mode, // 'borrow' or 'return'
    dept: flow.dept,
    number: flow.number,
    name: flow.name,
    deviceId: flow.deviceId,
    teacherName: flow.teacherName
  };

  try {
    const data = await jsonpRequest(params);
    if (data.status === 'ok') {
      const actionLabel = flow.mode === 'borrow' ? '貸出' : '返却';
      showStatus(
        flow.name + 'さん\n端末番号: ' + flow.deviceId + '\n承認: ' + flow.teacherName + ' 先生\n\n' +
        actionLabel + '記録が完了しました。',
        true
      );
    } else {
      showStatus('エラー: ' + data.message, false);
    }
  } catch (err) {
    showStatus('通信エラーが発生しました。\n' + err.message + '\nもう一度お試しください。', false);
  }
}

function showStatus(msg, isOk) {
  const el = document.getElementById('status');
  el.textContent = msg;
  el.className = isOk ? 'ok' : 'error';
}

// ============================================================
// 画面切り替え・リセット
// ============================================================
function showStep(n) {
  for (let i = 0; i <= 6; i++) {
    const el = document.getElementById('step' + i);
    if (el) el.classList.toggle('hidden', i !== n);
  }
}

function resetFlow() {
  flow = { mode: null, dept: null, number: null, name: null, deviceId: null, teacherId: null, teacherName: null };
  showStep(0);
}
</script>
</body>
</html>
